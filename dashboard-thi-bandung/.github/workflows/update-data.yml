# Memperbarui data dashboard mengikuti BMKG.
# Setiap jam (menit ke-23 UTC) pipeline mengecek apakah BMKG sudah merilis prakiraan baru;
# data lengkap hanya diambil, diolah, dan disimpan bila prakiraannya memang baru.
# Bisa juga dijalankan manual dari tab Actions (centang "paksa" untuk mengambil ulang).
name: Update data BMKG

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      paksa:
        description: 'Ambil ulang semua data walau prakiraan BMKG belum berubah'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ambil kode repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uji rumus THI
        run: npm test

      - name: Cek dan ambil data BMKG
        run: npm run update-data
        env:
          PAKSA: ${{ inputs.paksa && '1' || '' }}

      - name: Simpan data ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: pembaruan BMKG $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
